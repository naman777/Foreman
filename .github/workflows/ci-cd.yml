name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-services:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [coordinator, worker]
    # The coordinator's integration tests run its SQL against a real PostgreSQL.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: foreman
          POSTGRES_PASSWORD: foreman
          POSTGRES_DB: foreman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foreman -d foreman_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FOREMAN_TEST_DATABASE_URL: postgres://foreman:foreman@localhost:5432/foreman_test
    defaults:
      run:
        working-directory: node/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: node/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm test

  shared-types:
    name: Shared types are in sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/sync-shared-types.mjs --check

  dashboard:
    name: Lint and build dashboard
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm install --global pnpm@10.30.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: /api

  smoke:
    name: Compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Start the stack
        run: |
          docker compose up -d --build
          timeout 240 sh -c 'until curl -fsS http://localhost:8080/health >/dev/null && curl -fsS http://localhost:3000/ >/dev/null; do sleep 3; done'
      - name: Run end-to-end smoke test
        run: node scripts/node-smoke.mjs
      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy production
    needs: [node-services, shared-types, dashboard, smoke]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: Production
    concurrency:
      group: foreman-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Configure deploy key and pinned host key
        env:
          FOREMAN_DEPLOY_SSH_KEY: ${{ secrets.FOREMAN_DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$FOREMAN_DEPLOY_SSH_KEY" > "$HOME/.ssh/foreman_deploy"
          chmod 600 "$HOME/.ssh/foreman_deploy"
          cp .github/foreman_known_hosts "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Deploy tested commit
        run: |
          ssh -i "$HOME/.ssh/foreman_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            nkundra_be23@34.180.44.15 "$GITHUB_SHA"
