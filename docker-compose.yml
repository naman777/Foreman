services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foreman
      POSTGRES_PASSWORD: foreman
      POSTGRES_DB: foreman
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foreman"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # RustFS, the same S3-compatible store production runs.
    image: rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "9000:9000"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: foreman
      PGPASSWORD: foreman
      PGDATABASE: foreman
    volumes:
      - ./migrations:/migrations:ro
      - ./deploy/migrate.sh:/migrate.sh:ro
    entrypoint: /bin/sh
    command: ["/migrate.sh"]

  coordinator:
    build:
      context: ./node/coordinator
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://foreman:foreman@postgres:5432/foreman?sslmode=disable
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      COORDINATOR_SECRET: ${COORDINATOR_SECRET:-dev-secret-change-in-prod}
      PUBLIC_DEMO_ENABLED: "true"
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      PORT: 8080
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: ./node/worker
    depends_on:
      coordinator:
        condition: service_healthy
    environment:
      COORDINATOR_URL: http://coordinator:8080
      COORDINATOR_SECRET: ${COORDINATOR_SECRET:-dev-secret-change-in-prod}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      WORKER_CPU_CORES: 2
      WORKER_MEMORY_MB: 1024
      WORKER_MAX_PARALLEL_JOBS: 4
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      replicas: 3
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8080}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      coordinator:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
